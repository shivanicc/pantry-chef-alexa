<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pantry Chef · Alexa+ simulator</title>
<style>
  :root { --bg:#0b1020; --panel:#141b33; --panel2:#1b2447; --text:#e8ecff; --muted:#9aa5d1; --alexa:#31c4f3; --user:#5b6cff; --ok:#3ddc97; --warn:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid #26305a; display:flex; align-items:center; gap:12px; }
  .ring { width:28px; height:28px; border-radius:50%; background:radial-gradient(circle,#fff 0 20%,var(--alexa) 22% 60%,transparent 62%); box-shadow:0 0 18px var(--alexa); }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header small { color:var(--muted); }
  main { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; padding:16px 24px; max-width:1200px; margin:0 auto; }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid #26305a; border-radius:14px; padding:14px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  #chat { height:480px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.4; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .alexa { align-self:flex-start; background:var(--panel2); border-bottom-left-radius:4px; }
  .alexa::before { content:"Alexa+"; display:block; font-size:11px; color:var(--alexa); margin-bottom:4px; letter-spacing:.05em; }
  .tool { align-self:flex-start; font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted); background:#0f1530; border:1px dashed #2c3870; }
  form { display:flex; gap:8px; margin-top:10px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2c3870; background:#0f1530; color:var(--text); font-size:15px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:var(--alexa); color:#04131c; font-weight:700; cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { background:#0f1530; border:1px solid #2c3870; color:var(--muted); border-radius:999px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .chip:hover { color:var(--text); border-color:var(--alexa); }
  pre { margin:0; font-size:11.5px; line-height:1.4; color:#c7cff5; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto; }
  .tools li { margin-bottom:8px; } .tools code { color:var(--ok); }
  .status { font-size:12px; color:var(--muted); margin-top:8px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--warn); }
</style>
</head>
<body>
<header>
  <div class="ring"></div>
  <div><h1>Pantry Chef</h1><small>Simulated Alexa+ experience · talks to a real MCP server at <code>/mcp</code></small></div>
</header>
<main>
  <section class="panel">
    <h2>Conversation</h2>
    <div id="chat"></div>
    <form id="f">
      <input id="q" autocomplete="off" placeholder='Try: "Alexa, what can I cook tonight?"' />
      <button type="submit">Say it</button>
    </form>
    <div class="chips">
      <span class="chip">what's in my pantry?</span>
      <span class="chip">what can I cook tonight?</span>
      <span class="chip">something quick, under 10 minutes</span>
      <span class="chip">add bread and avocado</span>
      <span class="chip">we're out of eggs</span>
    </div>
  </section>
  <aside>
    <section class="panel">
      <h2>MCP server</h2>
      <div id="status" class="status">connecting…</div>
      <ul class="tools" id="tools"></ul>
    </section>
    <section class="panel" style="margin-top:16px">
      <h2>Last JSON-RPC exchange</h2>
      <pre id="trace">—</pre>
    </section>
  </aside>
</main>
<script>
const chat = document.getElementById("chat");
const trace = document.getElementById("trace");
const statusEl = document.getElementById("status");
let sessionId = null, rpcId = 1;

function bubble(cls, text){ const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }

async function rpc(method, params){
  const req = { jsonrpc:"2.0", id: rpcId++, method, params };
  const headers = { "Content-Type":"application/json", "Accept":"application/json", "MCP-Protocol-Version":"2025-11-25" };
  if (sessionId) headers["Mcp-Session-Id"] = sessionId;
  const r = await fetch("/mcp", { method:"POST", headers, body: JSON.stringify(req) });
  const sid = r.headers.get("Mcp-Session-Id"); if (sid) sessionId = sid;
  const res = await r.json();
  trace.textContent = "→ " + JSON.stringify(req, null, 1) + "\n\n← " + JSON.stringify(res, null, 1);
  if (res.error) throw new Error(res.error.message);
  return res.result;
}

async function callTool(name, args){
  bubble("tool", `tools/call ${name} ${JSON.stringify(args)}`);
  const r = await rpc("tools/call", { name, arguments: args });
  return r.structuredContent || JSON.parse(r.content[0].text);
}

const list = (a) => a.length ? a.join(", ") : "nothing";

// Very small "NLU": map an utterance to an MCP tool call, then phrase the result like Alexa+ would.
async function handle(utterance){
  const u = utterance.toLowerCase().replace(/^(hey |ok |okay )?alexa[, ]*/,"").trim();
  let m;
  if (/pantry|what do (i|we) have|inventory|what's in/.test(u) && !/add|remove|out of/.test(u)) {
    const d = await callTool("list_pantry", {});
    return `You have ${d.count} things in the pantry: ${list(d.items)}.`;
  }
  if ((m = u.match(/^(?:add|i bought|i got|put)\s+(.+?)(?:\s+(?:to|in)\s+(?:the|my)\s+pantry)?[.!]?$/))) {
    const items = m[1].split(/,|\band\b/).map(s=>s.trim()).filter(Boolean);
    const d = await callTool("add_to_pantry", { items });
    return d.added.length ? `Got it, I added ${list(d.added)}. You now have ${d.items.length} items.` : `Those were already in your pantry.`;
  }
  if ((m = u.match(/(?:remove|we're out of|we are out of|i'm out of|used up|no more)\s+(.+?)[.!]?$/))) {
    const items = m[1].split(/,|\band\b/).map(s=>s.trim()).filter(Boolean);
    const d = await callTool("remove_from_pantry", { items });
    return d.removed.length ? `Okay, I took ${list(d.removed)} off the list.` : `I couldn't find that in your pantry.`;
  }
  if (/cook|make|dinner|lunch|breakfast|eat|meal|recipe|hungry|quick/.test(u)) {
    const args = {};
    const mm = u.match(/(\d+)\s*min/); if (mm) args.max_minutes = Number(mm[1]);
    else if (/quick|fast/.test(u)) args.max_minutes = 15;
    const d = await callTool("suggest_meals", args);
    if (!d.suggestions.length) return "I couldn't find anything that fits. Try adding a few ingredients.";
    const lines = d.suggestions.map(s => s.missing.length
      ? `• ${s.name} (${s.minutes} min) — you'd still need ${list(s.missing)}`
      : `• ${s.name} (${s.minutes} min) — you have everything`);
    const lead = d.ready_now.length ? `You can make ${d.ready_now[0]} right now.` : "Nothing is fully ready, but here's what's close.";
    return `${lead}\n${lines.join("\n")}`;
  }
  return 'I can check your pantry, add or remove ingredients, or suggest what to cook. Try "what can I cook tonight?"';
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q"); const text = q.value.trim(); if (!text) return; q.value = "";
  bubble("user", text);
  try { bubble("alexa", await handle(text)); } catch (err) { bubble("alexa", "Sorry, something went wrong: " + err.message); }
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { document.getElementById("q").value = c.textContent; document.getElementById("f").requestSubmit(); }));

(async () => {
  try {
    const init = await rpc("initialize", { protocolVersion:"2025-11-25", capabilities:{}, clientInfo:{ name:"alexa-plus-simulator", version:"1.0.0" } });
    await fetch("/mcp", { method:"POST", headers:{ "Content-Type":"application/json", "Mcp-Session-Id": sessionId }, body: JSON.stringify({ jsonrpc:"2.0", method:"notifications/initialized" }) });
    const t = await rpc("tools/list", {});
    statusEl.textContent = `connected · ${init.serverInfo.name} v${init.serverInfo.version} · protocol ${init.protocolVersion} · session ${sessionId.slice(0,8)}…`;
    statusEl.className = "status ok";
    document.getElementById("tools").innerHTML = t.tools.map(x => `<li><code>${x.name}</code><br><span style="color:var(--muted)">${x.description}</span></li>`).join("");
    bubble("alexa", "Hi! I'm Pantry Chef. Ask me what's in your pantry or what you can cook tonight.");
  } catch (e) { statusEl.textContent = "could not reach MCP server: " + e.message; statusEl.className = "status bad"; }
})();
</script>
</body>
</html>
